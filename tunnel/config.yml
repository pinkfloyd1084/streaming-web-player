# ==============================================================================
# Cloudflare Tunnel Configuration for Radio Anarchy
# Hostname: radio.radioanarchy.gg -> Local Backend: http://127.0.0.1:8000
# ==============================================================================

# Replace with your Tunnel UUID generated by 'cloudflared tunnel create radio-anarchy'
# Example: tunnel: 3f4a2b1c-0000-0000-0000-123456789abc
tunnel: YOUR-TUNNEL-UUID-HERE
credentials-file: C:\RadioAnarchyMusicPlayer\tunnel\YOUR-TUNNEL-UUID-HERE.json

# Performance & Buffering Tweaks for Audio Range Streaming
warp-routing:
  enabled: false

ingress:
  # Route traffic for radio.radioanarchy.gg to local FastAPI Audio Player
  - hostname: radio.radioanarchy.gg
    service: http://127.0.0.1:8000
    originRequest:
      noTLSVerify: true
      connectTimeout: 30s
      tcpKeepAlive: 30s

  # Fallback 404 rule for any other hostnames
  - service: http_status:404
